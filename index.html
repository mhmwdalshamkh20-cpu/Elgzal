<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>محمود و لؤلؤة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Vazirmatn:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --cream:#FBF3EE;
    --cream-deep:#F4E6DE;
    --rose:#E3A6A0;
    --rose-soft:#EFC3BE;
    --deep-rose:#B86F6A;
    --gold:#C9A66B;
    --ink:#4A3535;
    --ink-soft:#8A6F6A;
    --white:#FFFDFB;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    font-family:'Vazirmatn',sans-serif;
    background:var(--cream);
    color:var(--ink);
    line-height:1.8;
    overflow-x:hidden;
  }

  h1,h2,h3,.display{
    font-family:'Aref Ruqaa',serif;
    font-weight:700;
  }

  .hearts-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .heart{
    position:absolute;
    bottom:-40px;
    opacity:0.35;
    color:var(--rose-soft);
    animation:floatUp linear infinite;
    font-size:22px;
  }
  @keyframes floatUp{
    0%{transform:translateY(0) translateX(0) rotate(0deg);opacity:0;}
    10%{opacity:0.35;}
    90%{opacity:0.35;}
    100%{transform:translateY(-110vh) translateX(20px) rotate(20deg);opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .heart{animation:none;display:none;}
  }

  section{
    position:relative;
    z-index:1;
    padding:100px 24px;
    max-width:900px;
    margin:0 auto;
  }

  .hero{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:60px 24px;
    background:radial-gradient(ellipse at top, var(--cream-deep) 0%, var(--cream) 60%);
  }

  .hero .eyebrow{
    color:var(--deep-rose);
    font-size:15px;
    letter-spacing:0.02em;
    margin-bottom:18px;
  }

  .hero h1{
    font-size:clamp(48px, 9vw, 96px);
    color:var(--deep-rose);
    line-height:1.15;
    margin-bottom:20px;
  }

  .hero .since{
    color:var(--ink-soft);
    font-size:17px;
    margin-bottom:56px;
  }

  .counter{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }

  .counter .box{
    background:var(--white);
    border:1px solid var(--rose-soft);
    border-radius:14px;
    padding:22px 20px;
    min-width:92px;
    box-shadow:0 8px 24px -12px rgba(184,111,106,0.35);
  }

  .counter .num{
    font-family:'Aref Ruqaa',serif;
    font-size:38px;
    color:var(--deep-rose);
    display:block;
  }

  .counter .label{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:4px;
    display:block;
  }

  .hero-photo{
    margin-top:56px;
    width:220px;
    height:220px;
    border-radius:50%;
    border:6px solid var(--white);
    box-shadow:0 14px 40px -14px rgba(184,111,106,0.5);
    background:linear-gradient(135deg, var(--rose-soft), var(--gold));
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--white);
    font-size:14px;
    text-align:center;
    overflow:hidden;
  }
  .hero-photo img{width:100%;height:100%;object-fit:cover;}

  .section-title{
    text-align:center;
    font-size:clamp(30px,5vw,42px);
    color:var(--deep-rose);
    margin-bottom:12px;
  }
  .section-sub{
    text-align:center;
    color:var(--ink-soft);
    font-size:15px;
    margin-bottom:60px;
  }

  .timeline{
    position:relative;
    padding-right:2px;
  }
  .timeline::before{
    content:'';
    position:absolute;
    right:19px;
    top:8px;
    bottom:8px;
    width:2px;
    background:linear-gradient(to bottom, var(--rose-soft), var(--gold));
  }
  .t-item{
    position:relative;
    padding-right:56px;
    margin-bottom:48px;
  }
  .t-item:last-child{margin-bottom:0;}
  .t-dot{
    position:absolute;
    right:11px;
    top:4px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--white);
    border:3px solid var(--deep-rose);
  }
  .t-date{
    color:var(--gold);
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
  }
  .t-title{
    font-size:22px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .t-desc{
    color:var(--ink-soft);
    font-size:15px;
    max-width:600px;
  }

  .gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
  }
  .g-item{
    aspect-ratio:1;
    border-radius:16px;
    background:linear-gradient(135deg, var(--rose-soft), var(--cream-deep));
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--deep-rose);
    font-size:13px;
    text-align:center;
    cursor:pointer;
    overflow:hidden;
    transition:transform .25s ease;
    border:1px solid var(--rose-soft);
  }
  .g-item:hover{transform:translateY(-4px);}
  .g-item img{width:100%;height:100%;object-fit:cover;}

  @media (max-width:640px){
    .gallery{grid-template-columns:repeat(2,1fr);}
  }

  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(74,53,53,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:24px;
  }
  .lightbox.open{display:flex;}
  .lightbox-inner{
    background:var(--white);
    border-radius:18px;
    max-width:480px;
    width:100%;
    padding:28px;
    text-align:center;
  }
  .lightbox-inner .frame{
    width:100%;
    aspect-ratio:1;
    border-radius:12px;
    background:linear-gradient(135deg, var(--rose-soft), var(--cream-deep));
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--deep-rose);
    margin-bottom:16px;
    overflow:hidden;
  }
  .lightbox-inner .frame img{width:100%;height:100%;object-fit:cover;}
  .lightbox-inner p{color:var(--ink-soft);font-size:15px;margin-bottom:16px;}
  .close-btn{
    background:var(--deep-rose);
    color:var(--white);
    border:none;
    padding:10px 28px;
    border-radius:30px;
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    cursor:pointer;
  }

  .msg-card{
    background:var(--white);
    border-radius:20px;
    padding:48px 36px;
    text-align:center;
    box-shadow:0 14px 40px -18px rgba(184,111,106,0.4);
    border:1px solid var(--rose-soft);
  }
  .msg-text{
    font-size:20px;
    color:var(--ink);
    min-height:90px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:opacity .3s ease;
  }
  .msg-btn{
    margin-top:24px;
    background:transparent;
    border:2px solid var(--deep-rose);
    color:var(--deep-rose);
    padding:11px 30px;
    border-radius:30px;
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease;
  }
  .msg-btn:hover{background:var(--deep-rose);color:var(--white);}

  .empty-note{
    text-align:center;
    color:var(--ink-soft);
    font-size:14px;
    padding:20px;
  }

  footer{
    text-align:center;
    padding:50px 24px 70px;
    color:var(--ink-soft);
    font-size:14px;
    position:relative;
    z-index:1;
  }
  footer .heart-ico{color:var(--rose);}

  /* ======= لوحة التعديل ======= */
  .edit-fab{
    position:fixed;
    bottom:24px;
    left:24px;
    z-index:40;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--deep-rose);
    color:var(--white);
    border:none;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 10px 24px -8px rgba(184,111,106,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(74,53,53,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:60;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}

  .pw-box{
    background:var(--white);
    border-radius:16px;
    padding:32px;
    max-width:360px;
    width:100%;
    text-align:center;
  }
  .pw-box input{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--rose-soft);
    margin:16px 0;
    font-family:'Vazirmatn',sans-serif;
    font-size:15px;
  }
  .pw-box .err{color:var(--deep-rose);font-size:13px;min-height:18px;margin-bottom:4px;}

  .admin-box{
    background:var(--white);
    border-radius:16px;
    max-width:640px;
    width:100%;
    max-height:85vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .admin-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--rose-soft);
  }
  .admin-header h3{color:var(--deep-rose);font-size:20px;}
  .admin-close{background:none;border:none;font-size:24px;color:var(--ink-soft);cursor:pointer;line-height:1;}

  .admin-tabs{
    display:flex;
    gap:4px;
    padding:12px 24px 0;
    border-bottom:1px solid var(--rose-soft);
    overflow-x:auto;
  }
  .admin-tab{
    background:none;
    border:none;
    padding:10px 14px;
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:3px solid transparent;
    white-space:nowrap;
  }
  .admin-tab.active{color:var(--deep-rose);border-bottom-color:var(--deep-rose);font-weight:600;}

  .admin-content{
    padding:20px 24px;
    overflow-y:auto;
    flex:1;
  }
  .admin-panel{display:none;}
  .admin-panel.active{display:block;}

  .field-row{margin-bottom:14px;}
  .field-row label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .field-row input, .field-row textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--rose-soft);
    font-family:'Vazirmatn',sans-serif;
    font-size:14px;
    background:var(--white);
    color:var(--ink);
  }
  .field-row textarea{min-height:70px;resize:vertical;}

  .admin-item{
    border:1px solid var(--rose-soft);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
  }
  .admin-item-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .btn-small{
    padding:7px 16px;
    border-radius:20px;
    border:none;
    font-size:13px;
    cursor:pointer;
    font-family:'Vazirmatn',sans-serif;
  }
  .btn-save{background:var(--deep-rose);color:var(--white);}
  .btn-delete{background:transparent;color:var(--deep-rose);border:1px solid var(--deep-rose);}
  .btn-add{background:var(--gold);color:var(--white);width:100%;padding:10px;border-radius:10px;border:none;font-size:14px;cursor:pointer;margin-top:6px;}

  .save-status{font-size:13px;color:var(--ink-soft);margin-top:10px;min-height:18px;}
</style>
</head>
<body>

<div class="hearts-bg" id="heartsBg"></div>

<!-- ============ HERO ============ -->
<section class="hero">
  <div class="eyebrow">قصة حب</div>
  <h1 id="namesTitle">...</h1>
  <div class="since" id="sinceText">بنحمّل الداتا...</div>

  <div class="counter" id="counter">
    <div class="box"><span class="num" id="numYears">0</span><span class="label">سنة</span></div>
    <div class="box"><span class="num" id="numMonths">0</span><span class="label">شهر</span></div>
    <div class="box"><span class="num" id="numDays">0</span><span class="label">يوم</span></div>
    <div class="box"><span class="num" id="numHours">0</span><span class="label">ساعة</span></div>
  </div>

  <div class="hero-photo" id="heroPhoto">صورة</div>
</section>

<!-- ============ TIMELINE ============ -->
<section id="story">
  <h2 class="section-title">قصتنا</h2>
  <p class="section-sub">كل محطة فيها حاجة نفتكرها</p>
  <div class="timeline" id="timelineList">
    <p class="empty-note">بنحمّل قصتكم...</p>
  </div>
</section>

<!-- ============ GALLERY ============ -->
<section id="gallery">
  <h2 class="section-title">صورنا</h2>
  <p class="section-sub">دوس على أي صورة تكبر</p>
  <div class="gallery" id="galleryGrid">
    <p class="empty-note">بنحمّل الصور...</p>
  </div>
</section>

<div class="lightbox" id="lightbox">
  <div class="lightbox-inner">
    <div class="frame" id="lightboxFrame">صورة</div>
    <p id="lightboxCaption"></p>
    <button class="close-btn" id="closeLightbox">قفل</button>
  </div>
</div>

<!-- ============ MESSAGES ============ -->
<section id="messages">
  <h2 class="section-title">رسايل ليكي</h2>
  <p class="section-sub">دوس على الزرار كل مرة تحب تقرا رسالة جديدة</p>

  <div class="msg-card">
    <div class="msg-text" id="msgText">بنحمّل الرسايل...</div>
    <button class="msg-btn" id="msgBtn">رسالة جديدة</button>
  </div>
</section>

<footer id="footerText">
  صنعت بحب <span class="heart-ico">♥</span>
</footer>

<!-- ============ FAB & ADMIN MODALS ============ -->
<button class="edit-fab" id="openEditFab" title="تعديل المحتوى">⚙️</button>

<!-- Password Modal -->
<div class="modal-overlay" id="pwModal">
  <div class="pw-box">
    <h3>دخول لوحة التعديل</h3>
    <input type="email" id="pwEmail" placeholder="الإيميل">
    <input type="password" id="pwInput" placeholder="كلمة السر">
    <div class="err" id="pwErr"></div>
    <button class="close-btn" id="pwSubmit">دخول</button>
  </div>
</div>

<!-- Admin Panel Modal -->
<div class="modal-overlay" id="adminModal">
  <div class="admin-box">
    <div class="admin-header">
      <h3>لوحة التحكم</h3>
      <button class="admin-close" id="adminClose">×</button>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" data-tab="tab-settings">الإعدادات</button>
      <button class="admin-tab" data-tab="tab-timeline">التايم لاين</button>
      <button class="admin-tab" data-tab="tab-gallery">الصور</button>
      <button class="admin-tab" data-tab="tab-messages">الرسايل</button>
    </div>
    <div class="admin-content">
      <!-- Settings Panel -->
      <div class="admin-panel active" id="tab-settings">
        <div class="field-row">
          <label>الاسم الأول</label>
          <input type="text" id="setN1">
        </div>
        <div class="field-row">
          <label>الاسم الثاني</label>
          <input type="text" id="setN2">
        </div>
        <div class="field-row">
          <label>تاريخ البداية (YYYY-MM-DD)</label>
          <input type="date" id="setStartDate">
        </div>
        <div class="field-row">
          <label>صورة الهيرو (رفع صورة)</label>
          <input type="file" id="setHeroFile" accept="image/*">
        </div>
        <button class="btn-small btn-save" id="saveSettingsBtn">حفظ الإعدادات</button>
        <div class="save-status" id="setSaveStatus"></div>
      </div>

      <!-- Timeline Panel -->
      <div class="admin-panel" id="tab-timeline">
        <div id="adminTimelineItems"></div>
        <button class="btn-add" id="addTimelineBtn">+ إضافة محطة جديدة</button>
      </div>

      <!-- Gallery Panel -->
      <div class="admin-panel" id="tab-gallery">
        <div class="field-row" style="background:var(--cream);padding:14px;border-radius:10px;margin-bottom:18px;">
          <label><b>إضافة صورة جديدة:</b></label>
          <input type="file" id="galNewFile" accept="image/*" style="margin-top:6px;">
          <input type="text" id="galNewCaption" placeholder="وصف الصورة (اختياري)" style="margin-top:6px;">
          <button class="btn-add" id="addGalleryBtn" style="margin-top:10px;">رفع وإضافة للصورة</button>
        </div>
        <div id="adminGalleryItems"></div>
      </div>

      <!-- Messages Panel -->
      <div class="admin-panel" id="tab-messages">
        <div id="adminMessagesItems"></div>
        <button class="btn-add" id="addMessageBtn">+ إضافة رسالة جديدة</button>
      </div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://jpwmejnykatgbdgqmebv.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impwd21lam55a2F0Z2JkZ3FtZWJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMzE3MjEsImV4cCI6MjEwNDcwNzcyMX0.LsohNMLHJVtYsu3buBS-RdEsTgWOlt5YltmrGN2DNc4";

  // كلمة السر

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let startDate = new Date("2023-01-01T00:00:00Z");
  let messagesList = [];
  let lastMsgIndex = -1;

  let currentSettingsData = null;
  let currentTimelineData = [];
  let currentGalleryData = [];
  let currentMessagesData = [];

  // ============ قلوب متحركة ============
  const heartsBg = document.getElementById("heartsBg");
  for(let i=0;i<14;i++){
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = "♥";
    h.style.left = Math.random()*100 + "%";
    h.style.animationDuration = (14 + Math.random()*14) + "s";
    h.style.animationDelay = (Math.random()*14) + "s";
    h.style.fontSize = (14 + Math.random()*16) + "px";
    heartsBg.appendChild(h);
  }

  // ============ عدّاد الوقت ============
  function updateCounter(){
    const now = new Date();
    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();
    let hours = now.getHours() - startDate.getHours();

    if(hours < 0){ hours += 24; days -= 1; }
    if(days < 0){
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      days += prevMonth;
      months -= 1;
    }
    if(months < 0){ months += 12; years -= 1; }
    if(years < 0){ years = 0; months = 0; days = 0; hours = 0; }

    document.getElementById("numYears").textContent = years;
    document.getElementById("numMonths").textContent = months;
    document.getElementById("numDays").textContent = days;
    document.getElementById("numHours").textContent = hours;
  }

  function formatDateArabic(d){
    return d.toLocaleDateString("ar-EG", { year:'numeric', month:'long', day:'numeric' });
  }

  // ============ تحميل البيانات ============
  async function loadSettings(){
    const { data, error } = await sb.from("settings").select("*").eq("id", 1).single();
    if(error || !data){
      document.getElementById("namesTitle").textContent = "محمود & لؤلؤة";
      document.getElementById("sinceText").textContent = "تعذّر تحميل الإعدادات";
      currentSettingsData = null;
      return;
    }
    currentSettingsData = data;
    document.getElementById("namesTitle").textContent = `${data.name1} & ${data.name2}`;
    startDate = new Date(data.start_date);
    document.getElementById("sinceText").textContent = `من ${formatDateArabic(startDate)} وإحنا مع بعض`;
    document.getElementById("footerText").innerHTML = `صنعت بحب <span class="heart-ico">♥</span> ${data.name1} و ${data.name2}`;

    const heroPhoto = document.getElementById("heroPhoto");
    if(data.hero_image_url){
      heroPhoto.innerHTML = `<img src="${data.hero_image_url}" alt="">`;
    } else {
      heroPhoto.textContent = "ضيف صورتكم من لوحة التحكم";
    }

    updateCounter();
  }

  async function loadTimeline(){
    const container = document.getElementById("timelineList");
    const { data, error } = await sb.from("timeline").select("*").order("sort_order", { ascending:true });
    currentTimelineData = (!error && data) ? data : [];
    if(error || !data || data.length === 0){
      container.innerHTML = `<p class="empty-note">مفيش محطات لسه، ضيفها من لوحة التعديل</p>`;
      return;
    }
    container.innerHTML = data.map(item => `
      <div class="t-item">
        <div class="t-dot"></div>
        <div class="t-date">${item.date_label}</div>
        <div class="t-title">${item.title}</div>
        <div class="t-desc">${item.description || ""}</div>
      </div>
    `).join("");
  }

  async function loadGallery(){
    const grid = document.getElementById("galleryGrid");
    const { data, error } = await sb.from("gallery").select("*").order("sort_order", { ascending:true });
    currentGalleryData = (!error && data) ? data : [];
    if(error || !data || data.length === 0){
      grid.innerHTML = `<p class="empty-note">مفيش صور لسه، ضيفها من لوحة التعديل</p>`;
      return;
    }
    grid.innerHTML = data.map(item => `
      <div class="g-item" data-caption="${(item.caption || "").replace(/"/g,'&quot;')}" data-img="${item.image_url}">
        <img src="${item.image_url}" alt="${item.caption || ""}">
      </div>
    `).join("");

    attachLightbox();
  }

  async function loadMessages(){
    const { data, error } = await sb.from("messages").select("*");
    const msgText = document.getElementById("msgText");
    currentMessagesData = (!error && data) ? data : [];
    if(error || !data || data.length === 0){
      msgText.textContent = "مفيش رسايل لسه، ضيفها من لوحة التعديل";
      return;
    }
    messagesList = data.map(m => m.text);
    msgText.textContent = messagesList[0];
  }

  function attachLightbox(){
    const lightbox = document.getElementById("lightbox");
    const lightboxFrame = document.getElementById("lightboxFrame");
    const lightboxCaption = document.getElementById("lightboxCaption");

    document.querySelectorAll(".g-item").forEach(item=>{
      item.addEventListener("click", ()=>{
        lightboxFrame.innerHTML = `<img src="${item.getAttribute("data-img")}" alt="">`;
        lightboxCaption.textContent = item.getAttribute("data-caption") || "";
        lightbox.classList.add("open");
      });
    });
  }

  document.getElementById("closeLightbox").addEventListener("click", ()=>{
    document.getElementById("lightbox").classList.remove("open");
  });

  document.getElementById("msgBtn").addEventListener("click", ()=>{
    if(messagesList.length === 0) return;
    let idx;
    do{ idx = Math.floor(Math.random()*messagesList.length); } while(idx === lastMsgIndex && messagesList.length > 1);
    lastMsgIndex = idx;

    const msgText = document.getElementById("msgText");
    msgText.style.opacity = 0;
    setTimeout(()=>{
      msgText.textContent = messagesList[idx];
      msgText.style.opacity = 1;
    }, 250);
  });

  // ============ رفع الصور إلى Supabase Storage ============
  async function uploadFileToSupabase(file) {
    const ext = file.name.split('.').pop();
    const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${ext}`;
    const { data, error } = await sb.storage.from("photos").upload(fileName, file);
    if(error) throw error;
    const { data: pubUrl } = sb.storage.from("photos").getPublicUrl(fileName);
    return pubUrl.publicUrl;
  }

  // ============ لوحة التحكم Admin Logic ============
  const openEditFab = document.getElementById("openEditFab");
  const pwModal = document.getElementById("pwModal");
  const pwInput = document.getElementById("pwInput");
  const pwErr = document.getElementById("pwErr");
  const pwSubmit = document.getElementById("pwSubmit");
  const adminModal = document.getElementById("adminModal");
  const adminClose = document.getElementById("adminClose");

  openEditFab.addEventListener("click", ()=>{
    pwInput.value = "";
    pwErr.textContent = "";
    pwModal.classList.add("open");
  });

  pwSubmit.addEventListener("click", async ()=>{
  const email = document.getElementById("pwEmail").value;
  const password = pwInput.value;
  pwErr.textContent = "بيتحقق...";

  const { error } = await sb.auth.signInWithPassword({ email, password });

  if(error){
    pwErr.textContent = "الإيميل أو كلمة السر غلط";
  } else {
    pwErr.textContent = "";
    pwModal.classList.remove("open");
    openAdminPanel();
  }
});

openEditFab.addEventListener("click", async ()=>{
  const { data } = await sb.auth.getSession();
  if(data.session){
    openAdminPanel();
  } else {
    pwInput.value = "";
    document.getElementById("pwEmail").value = "";
    pwErr.textContent = "";
    pwModal.classList.add("open");
  }
});

  adminClose.addEventListener("click", ()=> adminModal.classList.remove("open"));

  document.querySelectorAll(".admin-tab").forEach(tab=>{
    tab.addEventListener("click", ()=>{
      document.querySelectorAll(".admin-tab").forEach(t=>t.classList.remove("active"));
      document.querySelectorAll(".admin-panel").forEach(p=>p.classList.remove("active"));
      tab.classList.add("active");
      document.getElementById(tab.getAttribute("data-tab")).classList.add("active");
    });
  });

  function openAdminPanel(){
    adminModal.classList.add("open");
    renderAdminSettings();
    renderAdminTimeline();
    renderAdminGallery();
    renderAdminMessages();
  }

  // 1. إعدادات Admin
  function renderAdminSettings(){
    if(!currentSettingsData) return;
    document.getElementById("setN1").value = currentSettingsData.name1 || "";
    document.getElementById("setN2").value = currentSettingsData.name2 || "";
    if(currentSettingsData.start_date){
      document.getElementById("setStartDate").value = currentSettingsData.start_date.split("T")[0];
    }
  }

  document.getElementById("saveSettingsBtn").addEventListener("click", async ()=>{
    const status = document.getElementById("setSaveStatus");
    status.textContent = "جارِ الحفظ...";
    try {
      let heroUrl = currentSettingsData ? currentSettingsData.hero_image_url : "";
      const fileInput = document.getElementById("setHeroFile");
      if(fileInput.files.length > 0) {
        heroUrl = await uploadFileToSupabase(fileInput.files[0]);
      }

      const name1 = document.getElementById("setN1").value;
      const name2 = document.getElementById("setN2").value;
      const sDate = document.getElementById("setStartDate").value + "T00:00:00Z";

      const { error } = await sb.from("settings").upsert({
        id: 1,
        name1,
        name2,
        start_date: sDate,
        hero_image_url: heroUrl
      });

      if(error) throw error;
      status.textContent = "تم الحفظ بنجاح! ✨";
      loadSettings();
    } catch(err) {
      status.textContent = "حصل مشكلة أثناء الحفظ!";
      console.error(err);
    }
  });

  // 2. تايم لاين Admin
  function renderAdminTimeline(){
    const box = document.getElementById("adminTimelineItems");
    box.innerHTML = currentTimelineData.map((item, idx) => `
      <div class="admin-item" data-id="${item.id}">
        <div class="field-row">
          <label>التاريخ/الوقت (مثال: يناير 2023)</label>
          <input type="text" class="t-inp-date" value="${item.date_label}">
        </div>
        <div class="field-row">
          <label>العنوان</label>
          <input type="text" class="t-inp-title" value="${item.title}">
        </div>
        <div class="field-row">
          <label>الوصف</label>

          <textarea class="t-inp-desc">${item.description || ""}</textarea>
        </div>
        <div class="admin-item-actions">
          <button class="btn-small btn-save" onclick="saveTimelineItem('${item.id}', this)">حفظ</button>
          <button class="btn-small btn-delete" onclick="deleteTimelineItem('${item.id}')">حذف</button>
        </div>
      </div>
    `).join("");
  }

  async function saveTimelineItem(id, btn){
    const parent = btn.closest(".admin-item");
    const date_label = parent.querySelector(".t-inp-date").value;
    const title = parent.querySelector(".t-inp-title").value;
    const description = parent.querySelector(".t-inp-desc").value;

    await sb.from("timeline").update({ date_label, title, description }).eq("id", id);
    loadTimeline();
  }

  async function deleteTimelineItem(id){
    if(confirm("تأكيد حذف المحطة دي؟")){
      await sb.from("timeline").delete().eq("id", id);
      await loadTimeline();
      renderAdminTimeline();
    }
  }

  document.getElementById("addTimelineBtn").addEventListener("click", async ()=>{
    await sb.from("timeline").insert([{
      date_label: "التاريخ هنا",
      title: "عنوان المحطة",
      description: "اكتب وصف للمحطة هنا...",
      sort_order: currentTimelineData.length + 1
    }]);
    await loadTimeline();
    renderAdminTimeline();
  });

  // 3. صور Admin
  function renderAdminGallery(){
    const box = document.getElementById("adminGalleryItems");
    box.innerHTML = currentGalleryData.map(item => `
      <div class="admin-item" style="display:flex;gap:12px;align-items:center;">
        <img src="${item.image_url}" style="width:60px;height:60px;border-radius:8px;object-fit:cover;">
        <div style="flex:1;">
          <input type="text" class="g-inp-cap" value="${item.caption || ""}" placeholder="وصف الصورة" style="width:100%;padding:6px;border-radius:6px;border:1px solid var(--rose-soft);">
        </div>
        <button class="btn-small btn-save" onclick="saveGalleryItem('${item.id}', this)">حفظ</button>
        <button class="btn-small btn-delete" onclick="deleteGalleryItem('${item.id}')">حذف</button>
      </div>
    `).join("");
  }

  document.getElementById("addGalleryBtn").addEventListener("click", async ()=>{
    const fileInput = document.getElementById("galNewFile");
    const caption = document.getElementById("galNewCaption").value;
    if(fileInput.files.length === 0) return alert("اختر صورة أولاً!");

    try {
      const url = await uploadFileToSupabase(fileInput.files[0]);
      await sb.from("gallery").insert([{ image_url: url, caption, sort_order: currentGalleryData.length + 1 }]);
      fileInput.value = "";
      document.getElementById("galNewCaption").value = "";
      await loadGallery();
      renderAdminGallery();
    } catch(e) { alert("حدث خطأ أثناء رفع الصورة!"); }
  });

  async function saveGalleryItem(id, btn){
    const caption = btn.closest(".admin-item").querySelector(".g-inp-cap").value;
    await sb.from("gallery").update({ caption }).eq("id", id);
    loadGallery();
  }

  async function deleteGalleryItem(id){
    if(confirm("تأكيد حذف الصورة؟")){
      await sb.from("gallery").delete().eq("id", id);
      await loadGallery();
      renderAdminGallery();
    }
  }

  // 4. رسايل Admin
  function renderAdminMessages(){
    const box = document.getElementById("adminMessagesItems");
    box.innerHTML = currentMessagesData.map(item => `
      <div class="admin-item">
        <textarea class="m-inp-text" style="width:100%;min-height:50px;border-radius:6px;border:1px solid var(--rose-soft);padding:6px;">${item.text}</textarea>
        <div class="admin-item-actions">
          <button class="btn-small btn-save" onclick="saveMessageItem('${item.id}', this)">حفظ</button>
          <button class="btn-small btn-delete" onclick="deleteMessageItem('${item.id}')">حذف</button>
        </div>
      </div>
    `).join("");
  }

  async function saveMessageItem(id, btn){
    const text = btn.closest(".admin-item").querySelector(".m-inp-text").value;
    await sb.from("messages").update({ text }).eq("id", id);
    loadMessages();
  }

  async function deleteMessageItem(id){
    if(confirm("تأكيد حذف الرسالة؟")){
      await sb.from("messages").delete().eq("id", id);
      await loadMessages();
      renderAdminMessages();
    }
  }

  document.getElementById("addMessageBtn").addEventListener("click", async ()=>{
    await sb.from("messages").insert([{ text: "رسالة جديدة..." }]);
    await loadMessages();
    renderAdminMessages();
  });

  // ============ تشغيل الموقع ============
  setInterval(updateCounter, 1000);
  loadSettings();
  loadTimeline();
  loadGallery();
  loadMessages();
</script>

</body>
</html>
